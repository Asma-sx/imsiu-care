<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMSIU Care</title>
<meta name="description" content="UI screens of IMSIU Care, a clinic appointment booking app for university students.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --lavender: #a198c7;
    --teal: #74c6b8;
    --mint: #c5ebe0;
    --pink: #ffb3e9;
    --ink: #1f4e5a;
  }
  * { box-sizing: border-box; }
  html {
    min-height: 100%;
    background: linear-gradient(160deg, var(--lavender) 0%, var(--mint) 45%, #f7e9f3 75%, var(--pink) 100%);
  }
  body {
    margin: 0;
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    text-align: center;
    padding: 48px 16px 8px;
  }
  h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-size: clamp(36px, 7vw, 56px);
    margin: 0;
    letter-spacing: .5px;
  }
  header p {
    margin: 8px 0 0;
    font-size: 17px;
    opacity: .85;
  }
  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 32px 16px 56px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
  }
  figure {
    margin: 0;
    background: #fff;
    border-radius: 24px;
    padding: 18px 18px 14px;
    box-shadow: 0 14px 34px rgba(31, 78, 90, .14);
    text-align: center;
  }
  figure img {
    display: block;
    height: 440px;
    width: auto;
    max-width: 100%;
    object-fit: contain;
    margin: 0 auto;
  }
  figcaption {
    margin-top: 10px;
    font-family: "Playfair Display", Georgia, serif;
    font-size: 19px;
    font-weight: 600;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: repeat(2, 1fr); gap: 18px; }
  }
  @media (max-width: 520px) {
    main { grid-template-columns: 1fr; }
    figure img { height: auto; width: 100%; max-width: 280px; }
  }
</style>
</head>
<body>
  <header>
    <h1>IMSIU Care</h1>
    <p>Clinic appointment booking app for university students</p>
  </header>

  <main>
    <figure>
      <img src="screens/signin.jpg" alt="Sign in screen">
      <figcaption>Sign In</figcaption>
    </figure>
    <figure>
      <img src="screens/signup.jpg" alt="Sign up screen">
      <figcaption>Sign Up</figcaption>
    </figure>
    <figure>
      <img src="screens/home.jpg" alt="Home screen with clinic sections">
      <figcaption>Home</figcaption>
    </figure>
    <figure>
      <img src="screens/booking.jpg" alt="Book an appointment screen">
      <figcaption>Book an Appointment</figcaption>
    </figure>
    <figure>
      <img src="screens/confirmed.jpg" alt="Appointment confirmed screen with clinic location">
      <figcaption>Appointment Confirmed</figcaption>
    </figure>
    <figure>
      <img src="screens/reviews.jpg" alt="Reviews screen">
      <figcaption>Reviews</figcaption>
    </figure>
  </main>
</body>
</html>
